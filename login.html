<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">
  <form method="POST" action="/login" class="bg-white p-6 rounded shadow-md w-80">
    <h2 class="text-xl mb-4 text-center">Iniciar Sesión</h2>
    <input type="text" name="username" placeholder="Usuario" class="w-full mb-2 p-2 border rounded" required>
    <input type="password" name="password" placeholder="Contraseña" class="w-full mb-4 p-2 border rounded" required>
    <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded">Entrar</button>
  </form>
</body>
</html>
